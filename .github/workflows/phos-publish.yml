name: phos-publish

# phos publishes nautilus-trader to CodeArtifact (ADR-0015, TASK-0028)
# Trigger: push main -> build Linux + macOS -> publish
# NOTE: This repo is a fork, so GitHub does not allow referencing private actions
# (phosgroups/phos-actions). Build/publish logic is inlined here.
# Version = pyproject version + VERSION_SUFFIX (repo variable, e.g. +phos) + .{short-sha}.{run_number}
#   -> unique per run, e.g. 1.230.0+phos.a1b2c3d.42 (PEP 440 local version).
# Publish role: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${AWS_ROLE_NAME} (release env secrets).
# Region: AWS_REGION (release env secret).

on:
  push:
    branches: [main]

concurrency:
  group: phos-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.14"
  VERSION_SUFFIX: ${{ vars.VERSION_SUFFIX }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get uv version
        id: uv-version
        run: echo "version=$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup uv with pinned version
        run: |
          uv self update "${{ steps.uv-version.outputs.version }}" || true
          uv --version

      - name: Update version suffix (pyproject.toml)
        if: ${{ env.VERSION_SUFFIX != '' }}
        run: |
          set -euo pipefail
          current=$(grep '^version = ' pyproject.toml | cut -d '"' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUMBER="${{ github.run_number }}"
          new="${current}${VERSION_SUFFIX}.${SHORT_SHA}.${RUN_NUMBER}"
          sed -i.bak "s/^version = \".*\"/version = \"${new}\"/" pyproject.toml && rm -f pyproject.toml.bak
          echo "Version: ${current} -> ${new}"
        env:
          VERSION_SUFFIX: ${{ env.VERSION_SUFFIX }}

      - name: Setup Linux build deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y curl clang lld git make pkg-config ripgrep python3-dev libpython3-dev -o Acquire::Retries=5
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build wheel (Linux x86_64)
        run: |
          uv build --wheel
          ls -lh dist/

      - name: Verify wheel name
        run: |
          ls dist/*.whl | grep -q 'nautilus_trader-' \
            || { echo "::error::wheel name does not contain nautilus_trader-"; exit 1; }
          echo "wheel OK: $(ls dist/*.whl)"

      - name: Smoke test (wheel metadata version)
        run: |
          set -euo pipefail
          WHL=$(ls dist/nautilus_trader-*.whl | head -1)
          VER=$(basename "$WHL" | sed -E 's/^nautilus_trader-([^-]+)-.*/\1/')
          echo "Wheel version: ${VER}"
          if [ -n "${VERSION_SUFFIX}" ]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            RUN_NUMBER="${{ github.run_number }}"
            EXPECTED="${VERSION_SUFFIX//-/.}.${SHORT_SHA}.${RUN_NUMBER}"
            case "$VER" in
              *"${EXPECTED}"*) echo "version suffix present: OK" ;;
              *) echo "::error::expected version to contain ${EXPECTED}, got ${VER}"; exit 1 ;;
            esac
          fi
        env:
          VERSION_SUFFIX: ${{ env.VERSION_SUFFIX }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get uv version
        id: uv-version
        run: echo "version=$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup uv with pinned version
        run: |
          uv self update "${{ steps.uv-version.outputs.version }}" || true
          uv --version

      - name: Update version suffix (pyproject.toml)
        if: ${{ env.VERSION_SUFFIX != '' }}
        run: |
          set -euo pipefail
          current=$(grep '^version = ' pyproject.toml | cut -d '"' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUMBER="${{ github.run_number }}"
          new="${current}${VERSION_SUFFIX}.${SHORT_SHA}.${RUN_NUMBER}"
          sed -i.bak "s/^version = \".*\"/version = \"${new}\"/" pyproject.toml && rm -f pyproject.toml.bak
          echo "Version: ${current} -> ${new}"
        env:
          VERSION_SUFFIX: ${{ env.VERSION_SUFFIX }}

      - name: Setup Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build wheel (macOS arm64)
        run: |
          export PYO3_PYTHON=python3.14
          export RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup"
          if [ "$(uname -m)" = "arm64" ]; then
            export ARCHFLAGS="-arch arm64"
          fi
          uv build --wheel
          ls -lh dist/

      - name: Verify wheel name
        run: |
          ls dist/*.whl | grep -q 'nautilus_trader-' \
            || { echo "::error::wheel name does not contain nautilus_trader-"; exit 1; }
          echo "wheel OK: $(ls dist/*.whl)"

      - name: Smoke test (wheel metadata version)
        run: |
          set -euo pipefail
          WHL=$(ls dist/nautilus_trader-*.whl | head -1)
          VER=$(basename "$WHL" | sed -E 's/^nautilus_trader-([^-]+)-.*/\1/')
          echo "Wheel version: ${VER}"
          if [ -n "${VERSION_SUFFIX}" ]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            RUN_NUMBER="${{ github.run_number }}"
            EXPECTED="${VERSION_SUFFIX//-/.}.${SHORT_SHA}.${RUN_NUMBER}"
            case "$VER" in
              *"${EXPECTED}"*) echo "version suffix present: OK" ;;
              *) echo "::error::expected version to contain ${EXPECTED}, got ${VER}"; exit 1 ;;
            esac
          fi
        env:
          VERSION_SUFFIX: ${{ env.VERSION_SUFFIX }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Get uv version
        id: uv-version
        run: echo "version=$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup uv with pinned version
        run: |
          uv self update "${{ steps.uv-version.outputs.version }}" || true
          uv --version

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls -lh dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get CodeArtifact token
        id: codeartifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain phos \
            --region "${{ secrets.AWS_REGION }}" \
            --query authorizationToken --output text)
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Publish to CodeArtifact
        run: |
          PUBLISH_URL="https://aws:${{ steps.codeartifact.outputs.token }}@phos-${{ secrets.AWS_ACCOUNT_ID }}.d.codeartifact.${{ secrets.AWS_REGION }}.amazonaws.com/pypi/nautilus-pypi/"
          uv publish --publish-url "${PUBLISH_URL}" dist/*.whl

      - name: Write publish summary
        run: |
          {
            echo "## :package: nautilus-trader published to CodeArtifact"
            echo ""
            echo "| Package | Version | Platform |"
            echo "|---|---|---|"
            for WHL in dist/nautilus_trader-*.whl; do
              VER=$(basename "$WHL" | sed -E 's/^nautilus_trader-([^-]+)-.*/\1/')
              PLAT=$(basename "$WHL" | sed -E 's/^nautilus_trader-[^-]+-[^-]+-[^-]+-([^.]+)\.whl/\1/')
              echo "| nautilus-trader | \`${VER}\` | \`${PLAT}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
