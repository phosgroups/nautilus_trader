name: phos-publish

# phos publishes nautilus-trader v2 (python/, maturin) to CodeArtifact (ADR-0015 / ADR-0022, CR-0025).
# Trigger: push main -> build Linux + macOS -> publish (release environment gate).
# NOTE: This repo is a fork, so GitHub does not allow referencing private actions
# (phosgroups/phos-actions). Build/publish logic is inlined here.
# Version = python/pyproject.toml version + VERSION_SUFFIX (repo variable, e.g. +phos)
#   + .{short-sha}.{run_number} -> unique per run, e.g. 2.0.0rc1+phos.a1b2c3d.42 (PEP 440 local).
# Publish role: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${AWS_ROLE_NAME} (release env secrets).
# Region: AWS_REGION (release env secret).

on:
  push:
    branches: [main]

concurrency:
  group: phos-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.14"
  PACKAGE_DIR: python
  VERSION_SUFFIX: ${{ vars.VERSION_SUFFIX }}
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/build-v2-linux
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Free additional disk space (Linux)
        run: |
          echo "=== Disk usage before extra cleanup ==="
          df -h /
          for path in \
            /usr/share/swift \
            /usr/local/lib/swift \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft \
            /usr/local/julia*; do
            sudo rm -rf $path || true
          done
          echo "=== Disk usage after extra cleanup ==="
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get uv version
        run: echo "UV_VERSION=$(bash scripts/uv-version.sh)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: auto
          prune-cache: true

      - name: Update Rust toolchain (rustup)
        run: bash scripts/ci/install-rust.sh

      - name: Get Rust toolchain version
        run: echo "RUST_TOOLCHAIN=$(bash scripts/rust-toolchain.sh)" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
          override: true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/build-v2-linux"
          key: build-v2-linux
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}

      - name: Limit Cargo build jobs on cold cache
        run: bash scripts/ci/set-cargo-build-jobs.sh

      - name: Install Cap'n Proto
        uses: ./.github/actions/install-capnp

      - name: Update version suffix (python/pyproject.toml)
        if: ${{ env.VERSION_SUFFIX != '' }}
        run: |
          set -euo pipefail
          current=$(grep '^version = ' python/pyproject.toml | head -1 | cut -d '"' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUMBER="${{ github.run_number }}"
          new="${current}${VERSION_SUFFIX}.${SHORT_SHA}.${RUN_NUMBER}"
          sed -i.bak "s/^version = \".*\"/version = \"${new}\"/" python/pyproject.toml && rm -f python/pyproject.toml.bak
          echo "Version: ${current} -> ${new}"

      - name: Build wheel (Linux x86_64, v2)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --release --out ../dist
          ls -lh ../dist/

      - name: Verify wheel name (Linux)
        run: |
          set -euo pipefail
          WHL=$(ls dist/nautilus_trader-*.whl | head -1)
          NAME=$(basename "$WHL")
          echo "wheel: ${NAME}"
          case "$NAME" in
            nautilus_trader-*) ;;
            *) echo "::error::wheel name does not start with nautilus_trader-"; exit 1 ;;
          esac
          case "$NAME" in
            *manylinux_*) echo "platform tag manylinux: OK" ;;
            *linux_x86_64*) echo "::error::wheel tagged linux_x86_64 (not manylinux); enable maturin --zig fallback per ADR-0022"; exit 1 ;;
            *) echo "::error::unexpected Linux platform tag: ${NAME}"; exit 1 ;;
          esac
          if [ -n "${VERSION_SUFFIX}" ]; then
            EXPECTED="${VERSION_SUFFIX//-/.}.${GITHUB_SHA::7}.${{ github.run_number }}"
            case "$NAME" in
              *"${EXPECTED}"*) echo "version suffix present: OK" ;;
              *) echo "::error::expected version to contain ${EXPECTED}, got ${NAME}"; exit 1 ;;
            esac
          fi

      - name: Smoke test (v2 API + phos adapters)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../scripts/ci/smoke-test-v2-wheel.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    # Pin macOS 15: maturin derives the wheel platform tag from the build
    # environment (MACOSX_DEPLOYMENT_TARGET), so macos-15 + target 15.0 yields
    # macosx_15_0_arm64 (forward-compatible with newer macOS, ISSUE-0046).
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/build-v2-macos
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (macOS)
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/.ghcup || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get uv version
        run: echo "UV_VERSION=$(bash scripts/uv-version.sh)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: auto
          prune-cache: true

      - name: Update Rust toolchain (rustup)
        run: bash scripts/ci/install-rust.sh

      - name: Get Rust toolchain version
        run: echo "RUST_TOOLCHAIN=$(bash scripts/rust-toolchain.sh)" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
          override: true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/build-v2-macos"
          key: build-v2-macos
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}

      - name: Install Cap'n Proto
        uses: ./.github/actions/install-capnp

      - name: Update version suffix (python/pyproject.toml)
        if: ${{ env.VERSION_SUFFIX != '' }}
        run: |
          set -euo pipefail
          current=$(grep '^version = ' python/pyproject.toml | head -1 | cut -d '"' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUMBER="${{ github.run_number }}"
          new="${current}${VERSION_SUFFIX}.${SHORT_SHA}.${RUN_NUMBER}"
          sed -i.bak "s/^version = \".*\"/version = \"${new}\"/" python/pyproject.toml && rm -f python/pyproject.toml.bak
          echo "Version: ${current} -> ${new}"

      - name: Build wheel (macOS arm64, v2)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --release --out ../dist
          ls -lh ../dist/

      - name: Verify wheel name (macOS)
        run: |
          set -euo pipefail
          WHL=$(ls dist/nautilus_trader-*.whl | head -1)
          NAME=$(basename "$WHL")
          echo "wheel: ${NAME}"
          case "$NAME" in
            nautilus_trader-*) ;;
            *) echo "::error::wheel name does not start with nautilus_trader-"; exit 1 ;;
          esac
          EXPECTED_PLAT="macosx_${MACOSX_DEPLOYMENT_TARGET//./_}_arm64"
          case "$NAME" in
            *"${EXPECTED_PLAT}"*) echo "platform tag ${EXPECTED_PLAT}: OK" ;;
            *) echo "::error::expected wheel platform ${EXPECTED_PLAT}, got ${NAME}"; exit 1 ;;
          esac
          if [ -n "${VERSION_SUFFIX}" ]; then
            EXPECTED="${VERSION_SUFFIX//-/.}.${GITHUB_SHA::7}.${{ github.run_number }}"
            case "$NAME" in
              *"${EXPECTED}"*) echo "version suffix present: OK" ;;
              *) echo "::error::expected version to contain ${EXPECTED}, got ${NAME}"; exit 1 ;;
            esac
          fi

      - name: Smoke test (v2 API + phos adapters)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../scripts/ci/smoke-test-v2-wheel.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Get uv version
        id: uv-version
        run: echo "version=$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup uv with pinned version
        run: |
          uv self update "${{ steps.uv-version.outputs.version }}" || true
          uv --version

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls -lh dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get CodeArtifact token
        id: codeartifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain phos \
            --region "${{ secrets.AWS_REGION }}" \
            --query authorizationToken --output text)
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Publish to CodeArtifact
        run: |
          PUBLISH_URL="https://aws:${{ steps.codeartifact.outputs.token }}@phos-${{ secrets.AWS_ACCOUNT_ID }}.d.codeartifact.${{ secrets.AWS_REGION }}.amazonaws.com/pypi/nautilus-pypi/"
          uv publish --publish-url "${PUBLISH_URL}" dist/*.whl

      - name: Write publish summary
        run: |
          {
            echo "## :package: nautilus-trader published to CodeArtifact"
            echo ""
            echo "| Package | Version | Platform |"
            echo "|---|---|---|"
            for WHL in dist/nautilus_trader-*.whl; do
              VER=$(basename "$WHL" | sed -E 's/^nautilus_trader-([^-]+)-.*/\1/')
              PLAT=$(basename "$WHL" | sed -E 's/^nautilus_trader-[^-]+-[^-]+-[^-]+-([^.]+)\.whl/\1/')
              echo "| nautilus-trader | \`${VER}\` | \`${PLAT}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
